[project]
name = "agent-security-harness"
version = "0.1.0"
description = "Small harness that attacks two AI agents, checks what they did with plain code, and reports attack success with Wilson intervals."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "pydantic>=2.14",
  "pyyaml>=6",
  "python-dotenv",
  "langchain==1.4.7",
  "langchain-openai==1.7.3",
  "legacy-password-rotation-agent @ git+https://github.com/RodrigoCamposRodrigues/legacy-password-rotation-agent@5d154d786dd7e484d2b0659912d9f1ab09cc81a2",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inbox_agent" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["rotation: needs Chromium and Project 2's dashboard, no LLM"]
